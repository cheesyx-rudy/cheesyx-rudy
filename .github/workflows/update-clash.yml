name: Update Clash subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: clash-sub-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download Mihomo
        working-directory: clash-sub
        env:
          MIHOMO_VERSION: "1.19.30"
        run: |
          set -euo pipefail
          ARCHIVE="mihomo-linux-amd64-v1-v${MIHOMO_VERSION}.gz"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/${ARCHIVE}"
          wget -q --show-progress "$URL"
          gunzip -f "$ARCHIVE"
          mv "mihomo-linux-amd64-v1-v${MIHOMO_VERSION}" mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Verify Python sources
        working-directory: clash-sub
        run: |
          set -euo pipefail
          python -m py_compile build.py
          python - <<'PY'
          import yaml
          print("PyYAML:", yaml.__version__)
          PY

      - name: Build subscription
        working-directory: clash-sub
        run: |
          set -euo pipefail
          python build.py

      - name: Validate generated Mihomo config
        working-directory: clash-sub
        run: |
          set -euo pipefail
          test -s config.yaml
          ./mihomo -t -f config.yaml
          echo "Generated config.yaml:"
          wc -l config.yaml
          du -h config.yaml

      - name: Commit config
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash-sub/config.yaml
          if git diff --cached --quiet; then
            echo "No changes to config.yaml"
          else
            git commit -m "Update Clash subscription"
            git push
          fi
